services:
  db:
    image: postgres:16-alpine
    container_name: ecosem-postgres
    environment:
      POSTGRES_DB: campamentos_ecosem_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 73243894
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ecosem-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/campamentos_ecosem_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 73243894
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: ecosem-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: